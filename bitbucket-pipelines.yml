image: node:18

# Every pipeline delegates to ./s3-deploy.sh so CI and a laptop run the same
# code path. The script owns which page groups get built, the upload, the
# invalidation and the removal of stale objects — see its header.
#
# Page groups (node scripts/pageGroups.js list):
#   core          always built — root pages, chat, dashboard, itinerary, assets
#   themes        theme landing pages + /asia/thailand
#   events        event landing pages
#   destinations  2,306 continent/country/state/city pages — expensive, opt-in
#   trips         1,865 SEO trips pages + a ~3 min crawl — expensive, opt-in
#
# A plain tag ships the cheap groups. To publish destinations or trips, name
# them IN THE TAG — a tag push carries no pipeline variables, so the tag itself
# is the only lever a tag-driven deploy has:
#
#   prod-v4.8.0                  core,themes,events              (the default)
#   prod-trips-v4.8.0            core,themes,events,trips
#   prod-destinations-v4.8.0     core,themes,events,destinations
#   prod-trips-destinations-v4.8.0   both
#   prod-all-v4.8.0              every group
#
# Same tokens on dev-* tags. s3-deploy.sh does the parsing (groups_from_tag),
# so the build and deploy steps stay in sync without repeating it. The
# `deploy-prod` / `deploy-dev` custom pipelines still exist and their GROUPS
# variable takes precedence over any tag token.

definitions:
  caches:
    npm: ~/.npm
    # Webpack's incremental cache. Without it every CI build recompiles the
    # whole app from cold, which is most of the wall clock on a small release.
    nextcache: .next/cache
    # The trips prebuild snapshot. Restoring it turns the ~3 minute crawl of
    # 1,718 itineraries into a fetch of only the ones whose modified_at moved;
    # scripts/tripsSeoCache.js validates every entry, so a stale or missing
    # cache costs time, never correctness.
    seocache: .seo-cache

pipelines:
  # Tag-based deployments (FULLY AUTOMATIC)
  tags:
    # Development deployment: tags starting with 'dev-'
    dev-*:
      - step:
          name: Build for Development
          size: 4x
          caches:
            - node
            - npm
            - nextcache
            - seocache
          script:
            - echo "🚀 Tag-based deployment triggered"
            - echo "📌 Tag $BITBUCKET_TAG"
            - npm ci
            - apt-get update && apt-get install -y python3
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER
            - ./s3-deploy.sh dev --build-only
            - echo "✅ Build completed successfully"
          artifacts:
            - out/**
            # What the deploy step prunes with. Without it the deploy step has
            # no idea which files belong to which group and skips deletion.
            - .deploy-work/**

      - step:
          name: Deploy to Development
          script:
            - echo "📦 Deploying to Development (S3 + CloudFront)..."
            - apt-get update && apt-get install -y awscli
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_REGION
            - ./s3-deploy.sh dev --deploy-only
            - echo "✅ Deployment to Development completed successfully!"
          after-script:
            - |
              if [ $BITBUCKET_EXIT_CODE -ne 0 ]; then
                echo "❌ DEPLOYMENT FAILED!"
                echo "📌 Failed Tag $BITBUCKET_TAG"
                echo "⚠️  Previous version still running on server"
              fi

    # Production deployment: tags starting with 'prod-' (FULLY AUTOMATIC)
    prod-*:
      - step:
          name: Build for Production
          size: 4x
          caches:
            - node
            - npm
            - nextcache
            - seocache
          script:
            - echo "🚀 Production deployment triggered"
            - echo "📌 Tag $BITBUCKET_TAG"
            - |
              BRANCH=$(git rev-parse --abbrev-ref HEAD)
              if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "HEAD" ]; then
                echo "❌ ERROR: Production tags MUST be pushed from 'main' branch"
                echo "Current branch detected: $BRANCH"
                exit 1
              fi
            - npm ci
            - apt-get update && apt-get install -y python3
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER
            - ./s3-deploy.sh prod --build-only
            - echo "✅ Build completed successfully"
          artifacts:
            - out/**
            - .deploy-work/**

      - step:
          name: Deploy to Production
          script:
            - echo "📦 Deploying to Production (S3 + CloudFront)..."
            - echo "⚠️  PRODUCTION DEPLOYMENT IN PROGRESS"
            - apt-get update && apt-get install -y awscli
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_REGION
            - ./s3-deploy.sh prod --deploy-only
            - echo "✅ PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY!"
            - echo "🌐 Production is now live with this version"
          after-script:
            - |
              if [ $BITBUCKET_EXIT_CODE -ne 0 ]; then
                echo "❌ PRODUCTION DEPLOYMENT FAILED!"
                echo "📌 Failed Tag $BITBUCKET_TAG"
                echo "💡 Nothing is deleted before the CDN invalidation completes,"
                echo "   so a failure here leaves the previous build serving."
              fi

    # YourTrips deployment: tags starting with 'yourtrips-'
    yourtrips-*:
      - step:
          name: Build for YourTrips
          size: 4x
          caches:
            - node
            - npm
            - nextcache
            - seocache
          script:
            - npm ci
            - apt-get update && apt-get install -y python3
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER
            - ./s3-deploy.sh yourtrips --all --build-only
          artifacts:
            - out/**
            - .deploy-work/**

      - step:
          name: Deploy to YourTrips
          script:
            - apt-get update && apt-get install -y awscli
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_REGION
            - ./s3-deploy.sh yourtrips --all --deploy-only

  # Manually triggered deployments, for when a release has to include one of the
  # expensive groups (or to re-publish a single group on its own).
  custom:
    deploy-prod:
      - variables:
          - name: GROUPS
            default: "core,themes,events"
            description: "Page groups to build. 'all' builds everything. destinations ≈ +2,306 pages, trips ≈ +1,865 pages and a ~3 min crawl."
          - name: RECONCILE
            default: "false"
            allowed-values: ["false", "true"]
            description: "Also sweep group-owned prefixes — clears the 658 legacy /trips/<group_type>/ pages on a trips deploy."
          - name: DRY_RUN
            default: "false"
            allowed-values: ["false", "true"]
            description: "Build and report what would be deleted, change nothing on S3."
      - step:
          name: Build for Production (custom groups)
          size: 4x
          caches:
            - node
            - npm
            - nextcache
            - seocache
          script:
            - |
              BRANCH=$(git rev-parse --abbrev-ref HEAD)
              if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "HEAD" ]; then
                echo "❌ ERROR: production deploys must run from 'main'"
                exit 1
              fi
            - npm ci
            - apt-get update && apt-get install -y python3
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER
            - ./s3-deploy.sh prod --groups="$GROUPS" --build-only
          artifacts:
            - out/**
            - .deploy-work/**

      - step:
          name: Deploy to Production (custom groups)
          script:
            - apt-get update && apt-get install -y awscli
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_REGION
            - |
              FLAGS=""
              if [ "$RECONCILE" = "true" ]; then FLAGS="$FLAGS --reconcile"; fi
              if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
              ./s3-deploy.sh prod --groups="$GROUPS" --deploy-only $FLAGS

    deploy-dev:
      - variables:
          - name: GROUPS
            default: "core,themes,events"
            description: "Page groups to build. 'all' builds everything."
          - name: RECONCILE
            default: "false"
            allowed-values: ["false", "true"]
      - step:
          name: Build for Development (custom groups)
          size: 4x
          caches:
            - node
            - npm
            - nextcache
            - seocache
          script:
            - npm ci
            - apt-get update && apt-get install -y python3
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export BUILD_NUMBER=$BITBUCKET_BUILD_NUMBER
            - ./s3-deploy.sh dev --groups="$GROUPS" --build-only
          artifacts:
            - out/**
            - .deploy-work/**

      - step:
          name: Deploy to Development (custom groups)
          script:
            - apt-get update && apt-get install -y awscli
            - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$AWS_REGION
            - |
              FLAGS=""
              if [ "$RECONCILE" = "true" ]; then FLAGS="$FLAGS --reconcile"; fi
              ./s3-deploy.sh dev --groups="$GROUPS" --deploy-only $FLAGS
