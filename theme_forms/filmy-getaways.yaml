# theme_forms/filmy-getaways.yaml
#
# Mini-form spec for /theme/filmy-getaways. The frontend mirror of this file
# lives at components/theme/cinematic/themeForms/filmy-getaways.ts and must stay
# 1:1 with it.
#
# Companion to the model-only route brief (route_guides/filmy-getaways). Every
# route below is one film and carries that film's skeleton key verbatim — the
# theme page's cards map 1:1 onto the same keys, so a reader who arrives from a
# card and a reader who opens the form land on the same skeleton.
#
# Month-first (see season.ts), not stored date ranges: this theme spans eleven
# films across eleven seasons, and the only honest way to offer them is to ask
# for a month and show the films that actually run in it. Goa in July and
# Skopelos in January are not "worse" — they are shut.
#
# The season below runs all twelve months, but the strip only ever renders the
# next four (MAX_MONTHS in season.ts) — in August that's Sep–Dec, eight films
# down to four. A film whose season is further out is still one click away from
# its card on the theme page, and allow_exact_dates covers a reader who already
# knows their dates.
#
# `months` on each route is that film's season from the brief:
#   Switzerland / Paris ........ all year (months omitted)
#   Spain / Eat Pray Love ...... Apr–Jun, Sep–Oct
#   Yeh Jawaani ................ Mar–Jun          (Rohtang shuts under snow)
#   Dil Chahta Hai ............. Nov–Feb          (monsoon shuts the shacks)
#   Jab We Met ................. Mar–Jun, Sep–Nov
#   Tamasha (Corsica) .......... Apr–Oct          (the island closes Nov–Mar)
#   Mamma Mia .................. May–Oct          (ferries stop off-season)
#   Harry Potter ............... May–Sep          (Jacobite runs late Mar–Oct)
#   Lord of the Rings .......... Nov–Apr          (NZ summer)

slug: filmy-getaways
display: Filmy getaways
tagline: >-
  Some stories are too good to just watch. Tell me the month and the film and
  I'll build the route around the places that actually made it.
voice: >-
  Cinematic and unhurried. Frames the trip like scenes, names the real location
  rather than the set, and never bends a leg just to hit a filming spot.

copy:
  dates_title: When are you going?
  dates_sub: Every film has its own season. Pick a month, I'll show you which ones run.
  pax_title: Who's coming?
  pax_sub: So I can size the stays and the transfers.
  footer: That's the whole form. The page already told me it's a film trip.
  cta: Draft my scene →

season:
  - month: 1
    label: Sun and the far south
    tag: BEACH SEASON
    line: Goa is dry and full of light, New Zealand deep in its summer.

  - month: 2
    label: Middle-earth summer
    tag: BEST FOR NZ
    line: Queenstown at its longest days; Goa still shack season.

  - month: 3
    label: The hills wake up
    line: Himachal opens back up as New Zealand runs out its last summer weeks.

  - month: 4
    label: Everything reopens
    tag: SHOULDER
    line: Corsica and Spain come back on, Manali clears, Bali starts its dry run.

  - month: 5
    label: Nearly every film runs
    tag: MOST CHOICE
    line: Greek ferries start, the Highlands clear, and the Alps go green.

  - month: 6
    label: Meadows and long days
    tag: MOST BOOKED
    line: The DDLJ green, the Spanish coast before the heat, Manali before the rain.

  - month: 7
    label: High summer, fewer films
    tag: BUSIEST
    line: Rome and Bali sit this one out — Corsica, Greece and Scotland carry it.

  - month: 8
    label: Islands and Highlands
    line: The Mediterranean at full volume; Scotland at its warmest and its fullest.

  - month: 9
    label: The month that reads best
    tag: BEST LIGHT
    line: Rome, Spain, Greece, Corsica and the Alps all clear at once — crowds gone.

  - month: 10
    label: Golden and quiet
    tag: BEST VALUE
    line: Larches in Switzerland, the last Greek ferries, Corsica before it shuts.

  - month: 11
    label: Goa season opens
    line: The shacks are back up, New Zealand's summer starts, Himachal turns crisp.

  - month: 12
    label: Sun or snow
    line: Goa at its peak and NZ at its longest days; Switzerland and Paris turn festive.

# ── The films ───────────────────────────────────────────────────────────────
# Order matches the theme page: six Bollywood scenes, then five Hollywood.
routes:
  - key: switzerland_ddlj
    label: DDLJ, the Switzerland dream
    blurb: Lucerne → Wengen → Montreux, the Jungfrau meadows
    tag: MOST PICKED
    nights: 7
    skeleton: switzerland_ddlj
    fare_note: >-
      ZRH in / GVA out, direct from DEL and BOM. All of it on Swiss rail with a
      Travel Pass; Wengen is car-free, so the last leg is the Lauterbrunnen cog.
      Runs all year — the season changes the price and the light, not the route.

  - key: znmd_spain
    label: ZNMD, Spain awaits
    blurb: Barcelona → Costa Brava → Valencia → Seville, the road trip
    tag: THE ROAD TRIP
    nights: 10
    months: [4, 5, 6, 9, 10]
    skeleton: znmd_spain
    fare_note: >-
      BCN in / MAD out, one stop via DXB, DOH or IST. Self-drive from Barcelona
      to Valencia — the drive is the film. Bunol tomatina is the last Wednesday
      of August and Pamplona is 6–14 July; both are festival-week only.

  - key: yjhd_india
    label: Yeh Jawaani — mountains to palaces
    blurb: Manali → Delhi → Udaipur, the trek then the wedding
    tag: DOMESTIC
    nights: 8
    months: [3, 4, 5, 6]
    skeleton: yjhd_india
    fare_note: >-
      Domestic — DEL in / UDR out, no international gateway. Manali carries the
      trek (Solang, Gulaba), Udaipur the palace wedding. Bhuntar flights cancel
      often, so the Delhi–Manali road is the reliable default.

  - key: dch_goa
    label: Dil Chahta Hai, Goa forever
    blurb: Mumbai → North Goa → South Goa, Chapora and the sea
    tag: DOMESTIC
    nights: 6
    months: [11, 12, 1, 2]
    skeleton: dch_goa
    fare_note: >-
      Domestic — BOM in / GOX out. Chapora Fort is the wall shot and sits in the
      North Goa block. Monsoon Jun–Sep shuts the water sports and most shacks.

  - key: jabwemet_hills
    label: Jab We Met, hill-town joy
    blurb: Shimla → Manali, in on the Kalka toy train
    tag: DOMESTIC
    nights: 7
    months: [3, 4, 5, 6, 9, 10, 11]
    skeleton: jabwemet_hills
    fare_note: >-
      Domestic loop out of DEL. The Kalka–Shimla toy train is the hero transfer,
      never a car — UNESCO narrow gauge, ~5h30, books out early.

  - key: tamasha_corsica
    label: Tamasha, Corsica calling
    blurb: Ajaccio → Porto → Bonifacio, cliffs and silence
    tag: OFFBEAT
    nights: 8
    months: [4, 5, 6, 7, 8, 9, 10]
    skeleton: tamasha_corsica
    fare_note: >-
      No direct India–Corsica: route via Nice (NCE→AJA ~50m) or Paris. AJA in
      and out. Car-only on the island — rail reaches neither Porto nor
      Bonifacio. Much of Corsica closes Nov–Mar.

  - key: midnight_paris
    label: Midnight in Paris
    blurb: Paris, six nights, one city
    tag: ONE CITY
    nights: 6
    skeleton: midnight_paris
    fare_note: >-
      CDG in and out, direct from DEL and BOM. A single-city route by design —
      Versailles and Giverny are day trips, not second overnights. All year;
      Sep–Nov and Apr–Jun read best on camera.

  - key: eatpraylove_bali_italy
    label: Eat Pray Love, Bali & Italy
    blurb: Rome → Ubud → Seminyak, both halves of the book
    tag: TWO COUNTRIES
    nights: 12
    months: [4, 5, 6, 9, 10]
    skeleton: eatpraylove_bali_italy
    fare_note: >-
      FCO in / DPS out — Italy first, Bali second, because the flight home from
      Denpasar is the short one. Naples and Pompeii are day trips out of Rome.
      Avoid Jul–Aug: wrong season for both halves.

  - key: mammamia_greece
    label: Mamma Mia — Greek islands
    blurb: Athens → Skopelos → Skiathos, the chapel island
    tag: ISLAND HOPPING
    nights: 8
    months: [5, 6, 7, 8, 9, 10]
    skeleton: mammamia_greece
    fare_note: >-
      ATH in and out, one stop via DXB, DOH or IST, then the ~50m hop to
      Skiathos and a ~1h ferry. Skopelos holds the chapel and is the anchor.
      May to early Oct only — ferries and island hotels shut off-season.

  - key: harrypotter_scotland
    label: Harry Potter, Scotland magic
    blurb: Edinburgh → Fort William → Glasgow, Glenfinnan and Glencoe
    tag: BOOK EARLY
    nights: 8
    months: [5, 6, 7, 8, 9]
    skeleton: harrypotter_scotland
    fare_note: >-
      EDI in / GLA out, one stop via LHR, DXB or DOH. The Highlands leg is a
      private car, not rail. The Jacobite steam train over Glenfinnan runs out
      of Fort William late Mar–Oct and sells out months ahead — book it before
      the trip is confirmed.

  - key: lotr_newzealand
    label: Lord of the Rings, New Zealand
    blurb: Auckland → Wellington → Queenstown, Glenorchy and Milford
    tag: LONGEST HAUL
    nights: 10
    months: [11, 12, 1, 2, 3, 4]
    skeleton: lotr_newzealand
    fare_note: >-
      AKL in and out, one stop via SIN, KUL or HKG — Queenstown has no long-haul,
      so the loop closes at Auckland. Hobbiton is a day trip from Auckland, ~2h
      each way. Nov–Apr; Queenstown in Jun–Aug is a ski trip, not this one.

allow_exact_dates: true

seed_prompts:
  - Keep the signature scene for last
  - Fewer transfers, longer stays
  - Add the day trips, not more cities
  - What does this cost, honestly?

hero:
  image: /theme-heroes/switzerland-ddlj.jpg
  title: Live your favourite movie
  subtext: Eleven films, eleven real routes — and the touristy bits trimmed out.
  tag: Bollywood + Hollywood
